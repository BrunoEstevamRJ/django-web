{% extends "base.html" %}

{% block title %}Login - Instituto Wescley Fagundes{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-700 mb-4">Login</h2>
    
    {% if form.errors %}
        <p class="text-red-500 text-center">Usuário ou senha incorretos. Tente novamente.</p>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label for="id_username" class="block text-gray-700">Usuário:</label>
            <input type="text" name="username" id="id_username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
            <label for="id_password" class="block text-gray-700">Senha:</label>
            <input type="password" name="password" id="id_password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Entrar</button>
    </form>

    <p class="text-center text-gray-600 mt-4">
        Ainda não tem uma conta? <a href="{% url 'accounts:signup' %}" class="text-blue-500 hover:underline">Cadastre-se</a>
    </p>
</div>
{% endblock %}
