{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-screen">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Criar Conta</h2>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            {% for field in form %}
                <div>
                    <label class="block text-gray-700 font-semibold mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-sm mt-1">{{ field.errors|striptags }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-300">
                Registrar
            </button>
        </form>

        <p class="text-center text-gray-600 mt-4">
            Já tem uma conta? 
            <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline">Entrar</a>
        </p>
    </div>
</div>
{% endblock %}

<style>
    html, body {
        height: 100%;
        margin: 0;
    }
    
    body {
        display: flex;
        flex-direction: column;
    }
    
    main {
        flex: 1; /* Garante que o conteúdo principal ocupe o espaço restante */
    }
    
    footer {
        margin-top: auto; /* Força o footer a ficar na parte inferior */
    }
    </style>
