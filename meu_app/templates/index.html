{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instituto Wescley Fagundes</title>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{% static 'favicon-32x32.png' %}"
    />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body>
    <header>
      <nav>
        <a class="logo" href="/">Instituto Wescley Fagundes</a>
        <div class="mobile-menu">
          <div class="line1"></div>
          <div class="line2"></div>
          <div class="line3"></div>
        </div>
        <ul class="nav-list">
          <li><a href="/">Início</a></li>
          <li>
            <a
              href="https://www.instagram.com/projetowescleyfagundes/"
              target="_blank"
              >Instagram</a
            >
          </li>
          <li><a href="/contato/">Contato</a></li>
          <li><a href="/admin/">Admin</a></li>

          {% if user.is_authenticated %}
          <span class="text-sm font-semibold"
            >Bem-vindo, {{ user.username }}!</span
          >
          <!-- Formulário de logout com aparência de link -->
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="nav-list-item logout-link">
              Logout
            </button>
          </form>
          {% else %}
          <a href="{% url 'accounts:login' %}" class="hover:underline">Login</a>
          {% endif %}
        </ul>
      </nav>
    </header>

    <main class="background-container" id="backgroundContainer">
        
      <script src="{% static 'scripts.js' %}"></script>

      <style>
        .nav-list-item {
          font-size: 16px;
          color: #333;
          padding: 10px 15px;
          text-decoration: none;
          transition: color 0.3s ease;
        }

        .nav-list-item:hover {
          color: #007bff;
        }
       
        .logout-link {
          background: none;
          border: none;
          padding: 0;
          text-decoration: none;
          color: inherit;
          cursor: pointer;
        }

        .logout-link:hover {
          color: #007bff;
        }
      </style>
    </main>    
  </body>
</html>
